<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Add Product</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="addingproduct.js" defer type="module"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10 px-6">

<!-- Header Buttons -->
<div class="w-full max-w-7xl flex justify-between items-center mb-10">
  <!-- Left Side -->
  <a href="/FYP-2024/website/Shop/admindashboard.html" 
     class="bg-black text-white px-6 py-2 rounded-lg shadow hover:bg-gray-800 transition inline-block">
     Back to Dashboard
  </a>

  <!-- Right Side -->
  <div class="flex space-x-4">
    <button id="showAdd" 
       class="bg-black text-white px-6 py-2 rounded-lg shadow hover:bg-gray-800 transition">
       Add Product
    </button>
    <button id="showDelete" 
       class="bg-black text-white px-6 py-2 rounded-lg shadow hover:bg-gray-800 transition">
       Delete Product
    </button>
    <button id="showEdit" 
       class="bg-black text-white px-6 py-2 rounded-lg shadow hover:bg-gray-800 transition">
       Edit Product
    </button>
  </div>
</div>


<!-- Add Product Section -->
<div id="addSection" class="w-full max-w-6xl mx-auto p-10 bg-gray-50 rounded-3xl shadow-xl">
  <h2 class="text-4xl font-bold text-center mb-10 text-gray-900">Add New Product</h2>

  <form id="productForm" class="space-y-10">

    <!-- Basic Info -->
    <div class="bg-gradient-to-r from-white via-gray-50 to-white p-6 rounded-3xl shadow-md hover:shadow-xl transition relative">
      <h3 class="text-xl font-semibold mb-6 text-gray-800 flex items-center gap-2">
        <span class="material-icons text-indigo-500">info</span> Basic Info
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" id="brand" placeholder="Brand" class="p-4 border border-gray-300 rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" required>
        <input type="text" id="name" placeholder="Product Name" class="p-4 border border-gray-300 rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" required>
        <select id="category" class="p-4 border border-gray-300 rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
          <option>Men</option>
          <option>Women</option>
          <option>Kids</option>
        </select>
        <input type="number" id="price" placeholder="Price" class="p-4 border border-gray-300 rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" required>
      </div>
    </div>

    <!-- Colors -->
    <div class="bg-gradient-to-r from-white via-gray-50 to-white p-6 rounded-3xl shadow-md hover:shadow-xl transition relative">
      <h3 class="text-xl font-semibold mb-4 text-gray-800 flex items-center gap-2">
        <span class="material-icons text-indigo-500">palette</span> Colors
      </h3>
      <select id="colors" multiple class="p-4 border border-gray-300 rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
        <option>Black</option>
        <option>Brown</option>
        <option>Gray</option>
        <option>Blue</option>
        <option>Red</option>
        <option>Green</option>
        <option>Orange</option>
        <option>Purple</option>
        <option>White</option>
        <option>Yellow</option>
      </select>
      <p class="text-xs text-gray-400 mt-1">Hold Ctrl or Cmd to select multiple</p>
    </div>

    <!-- Media -->
    <div class="bg-gradient-to-r from-white via-gray-50 to-white p-6 rounded-3xl shadow-md hover:shadow-xl transition grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="text-center relative">
        <h3 class="text-xl font-semibold mb-4 text-gray-800 flex items-center justify-center gap-2">
          <span class="material-icons text-indigo-500">image</span> Product Image
        </h3>
        <input type="file" id="productImage" accept="image/*" class="p-3 border border-gray-300 rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
        <div id="imagePreview" class="hidden mt-4">
          <img id="previewImg" class="mx-auto rounded-2xl shadow-lg border border-gray-200"/>
        </div>
      </div>
      <div class="text-center relative">
        <h3 class="text-xl font-semibold mb-4 text-gray-800 flex items-center justify-center gap-2">
          <span class="material-icons text-indigo-500">3d_rotation</span> 3D Model (.glb)
        </h3>
        <input type="file" id="modelFile" accept=".glb" class="p-3 border border-gray-300 rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
        <div id="modelPreview" class="hidden mt-4">
          <model-viewer id="previewModel" alt="3D Model" auto-rotate camera-controls style="width:100%; height:320px; border-radius:20px; border:1px solid #e5e7eb;"></model-viewer>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-4">
      <button type="reset" class="bg-gray-200 px-8 py-3 rounded-2xl hover:bg-gray-300 transition font-semibold">Reset</button>
      <button type="submit" class="bg-black text-white px-8 py-3 rounded-2xl ">Add Product</button>
    </div>

  </form>
</div>

<!-- Material Icons CDN -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


  <!-- Delete Section -->
  <div id="deleteSection" class="hidden w-full max-w-7xl bg-white border border-red-200 p-10 rounded-2xl shadow-lg space-y-6 mt-10">
    <h2 class="text-3xl font-bold text-black text-center">Delete Products</h2>
    <div id="productList" 
     class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
  <!-- JS se cards yahan append honge -->
</div>

      
      <!-- JS Inject Products -->
    </div></div>
    <!-- NEW: Edit Section -->
<div id="editSection" class="hidden w-full max-w-7xl bg-white border border-black p-10 rounded-2xl shadow-lg space-y-6 mt-10">
  <h2 class="text-3xl font-bold text-black text-center">Edit Products</h2>
  <div id="productListEdit" class="space-y-4"></div>
  
  <!-- Edit Form (hidden until user selects a product) -->
  <div id="editFormWrapper" class="hidden mt-8">
    <h3 class="text-xl font-bold text-gray-800 mb-4">Edit Selected Product</h3>
    <form id="editForm" class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Same fields as Add Form -->
      <div class="space-y-6">
        <div>
          <label for="editBrand" class="block text-sm font-semibold text-gray-700 mb-1">Brand</label>
          <input type="text" id="editBrand" class="w-full p-3 border rounded-lg" required>
        </div>
        <div>
          <label for="editName" class="block text-sm font-semibold text-gray-700 mb-1">Product Name</label>
          <input type="text" id="editName" class="w-full p-3 border rounded-lg" required>
        </div>
        <div>
          <label for="editCategory" class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
          <select id="editCategory" class="w-full p-3 border rounded-lg">
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="kids">Kids</option>
          </select>
        </div>
        <div>
          <label for="editPrice" class="block text-sm font-semibold text-gray-700 mb-1">Price</label>
          <input type="number" id="editPrice" class="w-full p-3 border rounded-lg" required>
        </div>
      </div>

      <div class="space-y-6">
        <div>
          <label for="editColors" class="block text-sm font-semibold text-gray-700 mb-1">Colors</label>
          <select id="editColors" multiple class="w-full p-3 border rounded-lg">
            <option value="Black">Black</option>
            <option value="Brown">Brown</option>
            <option value="Gray">Gray</option>
            <option value="Blue">Blue</option>
            <option value="Red">Red</option>
            <option value="Green">Green</option>
            <option value="Orange">Orange</option>
            <option value="Purple">Purple</option>
            <option value="White">White</option>
            <option value="Yellow">Yellow</option>
          </select>
        </div>
        <div>
          <label for="editImage" class="block text-sm font-semibold text-gray-700 mb-1">Change Image</label>
          <input type="file" id="editImage" accept="image/*" class="w-full p-3 border rounded-lg">
        </div>
        <div>
          <label for="editModel" class="block text-sm font-semibold text-gray-700 mb-1">Change 3D Model</label>
          <input type="file" id="editModel" accept=".glb" class="w-full p-3 border rounded-lg">
        </div>
      </div>

      <div class="md:col-span-2 flex justify-end gap-4 mt-6">
        <button type="submit" class="bg-black text-white px-6 py-3 rounded-lg shadow transition">Update Product</button>
      </div>
    </form>
  </div>
</div>

  <script>
    // Image preview
    document.getElementById('productImage').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('previewImg').src = e.target.result;
          document.getElementById('imagePreview').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    });

    // 3D Model preview
    document.getElementById('modelFile').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file && file.name.endsWith(".glb")) {
        const url = URL.createObjectURL(file);
        const viewer = document.getElementById('previewModel');
        viewer.src = url;
        document.getElementById('modelPreview').classList.remove('hidden');
      } else {
        alert("Please upload a valid .glb file.");
      }
    });

    // Reset button clears previews
    document.getElementById('resetBtn').addEventListener('click', function() {
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('modelPreview').classList.add('hidden');
      document.getElementById('previewImg').src = "";
      document.getElementById('previewModel').removeAttribute('src');
    });
  </script>
</body>
</html>
