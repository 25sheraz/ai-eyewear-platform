<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Face Shape App</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#0f172a;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --primary:#111827;
      --primary-hover:#374151;
      --light:#f8fafc;
      --shadow:0 10px 35px rgba(15,23,42,0.08);
      --radius:22px;
    }

    body{
      font-family:'Inter',sans-serif;
      background:
      radial-gradient(circle at top left,#dbeafe 0%,transparent 25%),
      radial-gradient(circle at bottom right,#ede9fe 0%,transparent 25%),
      #f1f5f9;
      min-height:100vh;
      padding:40px 20px;
      color:var(--text);
    }

    .container{
      width:100%;
      max-width:950px;
      margin:auto;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.5);
      border-radius:32px;
      padding:40px;
      box-shadow:var(--shadow);
      position:relative;
    }

    .top-bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:30px;
      gap:15px;
      flex-wrap:wrap;
    }

    .back-btn{
      width:auto;
      padding:12px 18px;
      border:none;
      border-radius:14px;
      background:#e2e8f0;
      color:#0f172a;
      font-weight:600;
      cursor:pointer;
      transition:0.25s ease;
      font-size:14px;
    }

    .back-btn:hover{
      background:#cbd5e1;
      transform:translateY(-2px);
    }

    .badge{
      background:#eef2ff;
      color:#4338ca;
      padding:10px 16px;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
    }

    .hero{
      text-align:center;
      margin-bottom:40px;
    }

    .hero h1{
      font-size:42px;
      font-weight:700;
      line-height:1.15;
      color:#0f172a;
      margin-bottom:14px;
      letter-spacing:-1px;
    }

    .hero p{
      color:var(--muted);
      font-size:16px;
      max-width:650px;
      margin:auto;
      line-height:1.7;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:25px;
      margin-top:25px;
    }

    .panel{
      background:#fff;
      border:1px solid var(--border);
      border-radius:24px;
      padding:24px;
      box-shadow:0 6px 20px rgba(15,23,42,0.04);
    }

    .panel-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:20px;
    }

    .panel-title h2{
      font-size:20px;
      font-weight:700;
      color:#111827;
    }

    .icon-box{
      width:42px;
      height:42px;
      border-radius:14px;
      background:#f1f5f9;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:600;
      color:#334155;
      margin-bottom:12px;
    }

    .category-wrapper{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .category-option{
      position:relative;
      flex:1;
      min-width:120px;
    }

    .category-option input{
      display:none;
    }

    .category-option span{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
      border:1.5px solid var(--border);
      border-radius:16px;
      background:#fff;
      cursor:pointer;
      transition:0.25s ease;
      font-weight:600;
      color:#475569;
    }

    .category-option input:checked + span{
      background:#111827;
      color:#fff;
      border-color:#111827;
      box-shadow:0 8px 20px rgba(17,24,39,0.15);
    }

    .upload-area{
      margin-top:20px;
      border:2px dashed #cbd5e1;
      background:#f8fafc;
      border-radius:20px;
      padding:28px;
      text-align:center;
      transition:0.25s ease;
    }

    .upload-area:hover{
      border-color:#94a3b8;
      background:#f1f5f9;
    }

    input[type="file"]{
      width:100%;
      margin-top:15px;
      padding:12px;
      border:none;
      background:#fff;
      border-radius:14px;
      font-size:14px;
      cursor:pointer;
      color:#475569;
    }

    .preview-img,
    .main-img{
      width:100%;
      margin-top:18px;
      border-radius:20px;
      object-fit:cover;
      max-height:280px;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);
      border:1px solid rgba(255,255,255,0.8);
    }

    video{
      width:100%;
      border-radius:20px;
      overflow:hidden;
      background:#000;
      margin-bottom:16px;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);
    }

    button{
      width:100%;
      border:none;
      outline:none;
      background:linear-gradient(135deg,#111827,#1f2937);
      color:#fff;
      padding:15px;
      border-radius:16px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:0.25s ease;
      margin-top:14px;
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 24px rgba(17,24,39,0.18);
      background:linear-gradient(135deg,#1f2937,#374151);
    }

    .capture-btn{
      background:linear-gradient(135deg,#2563eb,#1d4ed8);
    }

    .capture-btn:hover{
      background:linear-gradient(135deg,#1d4ed8,#1e40af);
    }

    .divider{
      margin:40px 0;
      height:1px;
      background:linear-gradient(to right,transparent,#cbd5e1,transparent);
      border:none;
    }

    #result{
      margin-top:20px;
      animation:fadeIn 0.35s ease;
    }

    .result-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:28px;
      padding:30px;
      box-shadow:0 10px 30px rgba(15,23,42,0.05);
    }

    .result-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .result-header h2{
      font-size:28px;
      color:#111827;
    }

    .result-chip{
      background:#ecfeff;
      color:#0f766e;
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
    }

    .result-info{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
      margin-top:22px;
    }

    .info-box{
      background:#f8fafc;
      border-radius:18px;
      padding:18px;
      border:1px solid #e2e8f0;
    }

    .info-box small{
      display:block;
      color:#64748b;
      margin-bottom:8px;
      font-size:12px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    .info-box strong{
      font-size:18px;
      color:#0f172a;
    }

    .products-title{
      margin:30px 0 18px;
      font-size:22px;
      font-weight:700;
      color:#111827;
    }

    .products-container{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      gap:20px;
    }

    .product-card{
      background:#fff;
      border-radius:22px;
      border:1px solid #e2e8f0;
      overflow:hidden;
      transition:0.3s ease;
      box-shadow:0 5px 15px rgba(15,23,42,0.04);
    }

    .product-card:hover{
      transform:translateY(-6px);
      box-shadow:0 18px 35px rgba(15,23,42,0.12);
    }

    .product-card img{
      width:100%;
      height:170px;
      object-fit:contain;
      background:#f8fafc;
      padding:15px;
    }

    .product-content{
      padding:18px;
    }

    .product-card p{
      margin-bottom:10px;
      color:#475569;
      font-size:14px;
      line-height:1.5;
    }

    .product-card strong{
      color:#0f172a;
      font-size:15px;
    }

    .view-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      background:#111827;
      color:#fff;
      text-decoration:none;
      font-weight:600;
      transition:0.25s ease;
    }

    .view-btn:hover{
      background:#374151;
    }

    .empty-state{
      text-align:center;
      padding:35px;
      background:#f8fafc;
      border-radius:20px;
      border:1px dashed #cbd5e1;
      color:#64748b;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:768px){

      body{
        padding:20px 14px;
      }

      .container{
        padding:24px;
        border-radius:24px;
      }

      .hero h1{
        font-size:30px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .products-container{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top-bar">
      <button class="back-btn" onclick="window.history.back()">← Back</button>
      <div class="badge">AI Smart Recommendation</div>
    </div>

    <div class="hero">
      <h1>Face Shape Detection & Glasses Recommendation</h1>
      <p>
        Upload or capture your photo and get AI-powered face shape detection
        with personalized glasses recommendations instantly.
      </p>
    </div>

    <!-- Category -->
    <form id="categoryForm">

      <label>Select Category</label>

      <div class="category-wrapper">

        <label class="category-option">
          <input type="radio" name="category" value="men" required>
          <span>👨 Men</span>
        </label>

        <label class="category-option">
          <input type="radio" name="category" value="women">
          <span>👩 Women</span>
        </label>

        <label class="category-option">
          <input type="radio" name="category" value="kids">
          <span>🧒 Kids</span>
        </label>

      </div>
    </form>

    <div class="grid">

      <!-- Upload -->
      <div class="panel">

        <div class="panel-title">
          <div class="icon-box">🖼️</div>
          <h2>Upload Image</h2>
        </div>

        <form enctype="multipart/form-data" id="uploadForm">

          <div class="upload-area">

            <p style="font-weight:600; color:#0f172a;">
              Drag & Drop or Choose Image
            </p>

            <p style="font-size:14px; color:#64748b; margin-top:8px;">
              JPG, PNG or WEBP supported
            </p>

            <input type="file"
                   name="image"
                   id="fileInput"
                   accept="image/*"
                   required />

          </div>

          <img id="preview" class="preview-img" src="" alt="">

          <button type="submit">
            Upload & Predict
          </button>

        </form>

      </div>

      <!-- Webcam -->
      <div class="panel">

        <div class="panel-title">
          <div class="icon-box">📷</div>
          <h2>Capture From Webcam</h2>
        </div>

        <video id="camera" autoplay></video>

        <button type="button"
                class="capture-btn"
                onclick="capture(event)">
          📸 Capture Photo
        </button>

        <canvas id="snapshot" style="display:none;"></canvas>

        <form enctype="multipart/form-data" id="cameraForm">

          <input type="hidden"
                 name="camera_image"
                 id="cameraImageInput" />

          <button type="submit">
            Upload Captured Image
          </button>

        </form>

      </div>

    </div>

    <hr class="divider"/>

    <!-- Result -->
    <div id="result"></div>

  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const uploadForm = document.getElementById('uploadForm');
    const cameraForm = document.getElementById('cameraForm');
    const video = document.getElementById('camera');
    const canvas = document.getElementById('snapshot');
    const cameraImageInput = document.getElementById('cameraImageInput');
    const resultSection = document.getElementById('result');

    // File preview
    fileInput?.addEventListener('change', () => {
      const file = fileInput.files[0];

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      }
    });

    // Camera stream
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
      })
      .catch(err => console.error("Webcam error:", err));

    function capture(event) {
      event?.preventDefault();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      canvas.getContext('2d').drawImage(video, 0, 0);

      const dataUrl = canvas.toDataURL('image/jpeg');

      cameraImageInput.value = dataUrl;

      alert("✅ Photo Captured Successfully!");
    }

    function getCategory() {
      const selected = document.querySelector('input[name="category"]:checked');
      return selected ? selected.value : null;
    }

    uploadForm.addEventListener("submit", async function (e) {

      e.preventDefault();

      let formData = new FormData(uploadForm);

      let category = getCategory();

      if (!category) {
        alert("⚠️ Please select a category first.");
        return;
      }

      formData.append("category", category);

      let response = await fetch("/api/predict", {
        method: "POST",
        body: formData
      });

      let result = await response.json();

      showResult(result);
    });

    cameraForm.addEventListener("submit", async function (e) {

      e.preventDefault();

      let formData = new FormData(cameraForm);

      let category = getCategory();

      if (!category) {
        alert("⚠️ Please select a category first.");
        return;
      }

      formData.append("category", category);

      let response = await fetch("/api/predict", {
        method: "POST",
        body: formData
      });

      let result = await response.json();

      showResult(result);
    });

    // Show result
    function showResult(result) {

      if (result.error) {

        resultSection.innerHTML = `
          <div class="result-card">
            <p style="color:red; font-weight:600;">
              ${result.error}
            </p>

            <button onclick="tryAgain()">
              Try Again
            </button>
          </div>
        `;

      } else {

        let productsHTML = "";

        if (result.recommended_products.length > 0) {

          result.recommended_products.forEach(p => {

            productsHTML += `
              <div class="product-card">

                <img src="${p.imageUrl}" alt="${p.name}">

                <div class="product-content">

                  <p>
                    <strong>${p.name}</strong>
                  </p>

                  <p>
                    Price: ${p.price}
                  </p>

                  <a href="http://127.0.0.1:5501/FYP-2024/website/Shop/product-view.html?id=${p.id}"
                     class="view-btn">
                    View Product
                  </a>

                </div>

              </div>
            `;
          });

        } else {

          productsHTML = `
            <div class="empty-state">
              No products found for this face shape.
            </div>
          `;
        }

        resultSection.innerHTML = `

          <div class="result-card">

            <div class="result-header">
              <h2>Prediction Result</h2>
              <div class="result-chip">
                AI Analysis Complete
              </div>
            </div>

            <div class="result-info">

              <div class="info-box">
                <small>Category</small>
                <strong>${result.category}</strong>
              </div>

              <div class="info-box">
                <small>Face Shape</small>
                <strong>${result.prediction}</strong>
              </div>

            </div>

            <img src="${result.uploaded_image}"
                 alt="Uploaded Image"
                 class="main-img">

            <h3 class="products-title">
              Recommended Glasses
            </h3>

            <div class="products-container">
              ${productsHTML}
            </div>

            <button onclick="tryAgain()"
                    style="margin-top:28px;">
              Try Again
            </button>

          </div>
        `;
      }
    }

    // Reset
    function tryAgain() {

      resultSection.innerHTML = "";

      fileInput.value = "";

      preview.src = "";

      preview.style.display = "none";

      cameraImageInput.value = "";
    }
  </script>

</body>
</html>
